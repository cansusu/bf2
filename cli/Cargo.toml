

[package]
name = "fpgacrack"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.2"
hex = "0.4"
#added
#libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "microbench"
harness = false

[profile.release]
#debug = true
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0        
#strip = "symbols"
[features]
debug = []

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Ctarget-feature=+avx2,+avx,+sse2,+avx512f,+avx512bw,+avx512vl"]
#rustflags = ["-C", "target-cpu=native"]
#rustflags = [
#  "-C", "target-cpu=haswell",
#  "-C", "target-feature=+sse2,+avx,+avx2,-avx512f,-avx512bw,-avx512vl",
#]
